# Lint, format, type-check, unit tests and builds of the Worker and the docs, on pushes to main and pull requests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build -w @vado/docs
      # Kumo's classes come from scanning its package (apps/dashboard/src/styles.css); a wrong path builds unstyled.
      - run: grep -q "bg-kumo-badge-blue" apps/dashboard/dist/client/assets/*.css
