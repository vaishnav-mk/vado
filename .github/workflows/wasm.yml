# Rebuild wasm/valkey.wasm and wasm/redis/redis.wasm from the official release
# tarballs and check that each committed binary is exactly what its build
# produces, and that its imports and exports match its interface.txt (what the
# JS host provides).
name: wasm

on:
  push:
    paths:
      - "wasm/**"
      - ".github/workflows/wasm.yml"
      - ".github/actions/wasm-toolchain/**"
  pull_request:
    paths:
      - "wasm/**"
      - ".github/workflows/wasm.yml"
      - ".github/actions/wasm-toolchain/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: valkey, dir: wasm }
          - { name: redis, dir: wasm/redis }
    name: build (${{ matrix.name }})
    env:
      DIR: ${{ matrix.dir }}
      WASM: ${{ matrix.name }}.wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/wasm-toolchain

      # Only the downloaded tarballs: build.sh extracts a fresh tree every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasm/.cache/*.tar.gz
          key: wasm-cache-${{ matrix.name }}-${{ hashFiles(format('{0}/build.sh', matrix.dir)) }}

      - id: build
        run: bash "$DIR/build.sh"

      - name: Interface matches interface.txt
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node wasm/interface.mjs "$DIR/build/$WASM" --check "$DIR/interface.txt"

      - name: Build is byte-identical to the committed wasm
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sha256sum "$DIR/build/$WASM" "$DIR/$WASM"
          stat -c '%s bytes  %n' "$DIR/build/$WASM" "$DIR/$WASM"
          if ! cmp "$DIR/build/$WASM" "$DIR/$WASM"; then
            echo "::error::$DIR/build/$WASM differs from the committed $DIR/$WASM." \
              "If the change is intended, copy the build (the ${{ matrix.name }}-wasm artifact) over $DIR/$WASM" \
              "and run: node wasm/interface.mjs $DIR/$WASM > $DIR/interface.txt"
            exit 1
          fi

      - name: Upload the built wasm
        if: ${{ failure() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-wasm
          path: ${{ matrix.dir }}/build/${{ matrix.name }}.wasm
          if-no-files-found: error
