name: wasm toolchain
description: >
  Install wasi-sdk 34 and binaryen version_133 (Linux x86_64), checked by sha256,
  and set WASI_SDK and PATH for packages/wasm/valkey/build.sh. These are the versions
  packages/wasm/valkey/valkey.wasm was built with; other versions give different bytes.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
        WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        BINARYEN_URL: https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
        BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      run: |
        set -euo pipefail
        [ "$(uname -sm)" = "Linux x86_64" ] || { echo "needs a Linux x86_64 runner" >&2; exit 1; }
        dir="$RUNNER_TEMP/wasm-toolchain"
        mkdir -p "$dir"
        cd "$dir"
        curl -fsSL --retry 3 "$WASI_SDK_URL" -o wasi-sdk.tar.gz
        curl -fsSL --retry 3 "$BINARYEN_URL" -o binaryen.tar.gz
        sha256sum -c - <<EOF
        $WASI_SDK_SHA256  wasi-sdk.tar.gz
        $BINARYEN_SHA256  binaryen.tar.gz
        EOF
        tar -xzf wasi-sdk.tar.gz
        tar -xzf binaryen.tar.gz
        rm wasi-sdk.tar.gz binaryen.tar.gz
        echo "WASI_SDK=$dir/wasi-sdk-34.0-x86_64-linux" >>"$GITHUB_ENV"
        echo "$dir/binaryen-version_133/bin" >>"$GITHUB_PATH"
        "$dir/wasi-sdk-34.0-x86_64-linux/bin/clang" --version | head -1
        "$dir/binaryen-version_133/bin/wasm-opt" --version
